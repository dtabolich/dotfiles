[tools]
# Python is Nix-owned (see home.nix python313.withPackages). Add a python entry
# here only when a project needs a version other than the system interpreter.
node = "24"

[settings]
experimental = true
# Applies to per-project Python pins: always take the self-contained prebuilt
# CPython instead of compiling, which links Homebrew libs that
# `onActivation.cleanup = "zap"` later deletes.
python.compile = false
